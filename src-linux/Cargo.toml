[package]
name = "src-linux"
version = "0.2.0"
edition = "2021"
description = "Minimal (<10 KB) Linux dummy game runner for Discord Quest Completer"
license = "MIT"
authors = [
    "Mark Terence Tiglao (original author)",
    "Linux port contributors",
]

# No dependencies on purpose: the runner is a freestanding, static ELF
# (no libc, no std) that only uses raw Linux syscalls.
[dependencies]

[[bin]]
name = "src-linux"
path = "src/main.rs"
test = false
bench = false

[profile.dev]
panic = "abort"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
overflow-checks = false
