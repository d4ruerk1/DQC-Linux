name: 'build-linux'

# Builds the Arch Linux / CachyOS pacman package (.pkg.tar.zst) inside an
# official Arch container and, on tags, attaches it to the GitHub release.
on:
  workflow_dispatch:
  push:
    branches: ['main', 'linux-port']
    tags: ['v*']

permissions:
  contents: write

jobs:
  arch-package:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed git rust nodejs npm \
            webkit2gtk-4.1 gtk3 libsoup3 openssl librsvg

      - uses: actions/checkout@v4

      - name: Build package with makepkg (as non-root user)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          useradd -m builder
          chown -R builder: "$GITHUB_WORKSPACE"
          sudo -u builder bash -c 'cd "$GITHUB_WORKSPACE" && packaging/arch/build-local.sh --nodeps'

      - name: Check runner size (author goal: <= 100 KB)
        run: |
          size=$(stat -c %s packaging/arch/src/discord-quest-completer-*/target/release/src-linux)
          echo "src-linux runner: ${size} bytes"
          test "$size" -le 102400

      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: packaging/arch/*.pkg.tar.zst

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/arch/*.pkg.tar.zst
          draft: true
          prerelease: true
          body: |
            Unofficial Linux port of [markterence/discord-quest-completer](https://github.com/markterence/discord-quest-completer) (MIT).
            Not affiliated with, endorsed by, or connected to Discord Inc. Using it may violate Discord's Terms/Quest rules: use at your own risk.
            Install on Arch/CachyOS: `sudo pacman -U discord-quest-completer-*.pkg.tar.zst`
